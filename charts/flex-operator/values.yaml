# Values for the Flex operator extension PoC.
#
# The chart mirrors upstream deploy/unbounded-operator at the pinned release.
# Extension Manager injects Azure.* values (cluster resource ID, region, ...);
# they are accepted but not used by this chart.

operator:
  # Full image-repository prefix for the operator AND every operator-managed
  # component image. Upstream resolves components as
  # <imageRegistry>/<component>:<operator version>, so the operator and its
  # components always come from the same registry.
  imageRegistry: ghcr.io/azure
  # Operator image name:tag without a registry. Defaults to
  # unbounded-operator:<Chart.appVersion>.
  image: ""
  imagePullPolicy: IfNotPresent
  # External API server endpoint advertised to remote machines. Empty lets the
  # operator auto-discover it (on AKS: the KUBERNETES_SERVICE_HOST FQDN set by
  # the kubernetes.azure.com/set-kube-service-host-fqdn pod annotation).
  apiServerEndpoint: ""
  # Upstream default. Translates legacy net-group Sites and reaps
  # pre-consolidation namespaces; irrelevant on a fresh cluster.
  reapLegacyResources: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Optional Unbounded Site objects. The operator installs CRDs at startup, so
# Sites cannot be rendered by this chart directly; they are applied by a
# post-install/post-upgrade hook Job once the Site CRD is established.
# Empty (default) installs only the operator. Example:
#   sites:
#     - name: cluster
#       nodeCidrs: ["10.224.0.0/16"]
#       podCidrs: ["10.244.0.0/16"]
#     - name: flex
#       nodeCidrs: ["10.241.0.0/16"]
#       podCidrs: ["10.245.0.0/16"]
#   sitePeering:
#     name: aks-flex-private-l3
#     sites: [cluster, flex]
sites: []
sitePeering: {}
siteJob:
  image: mcr.microsoft.com/oss/kubernetes/kubectl:v1.32.2
  timeoutSeconds: 300

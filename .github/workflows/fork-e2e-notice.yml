name: E2E Fork Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  e2e-fork-gate:
    name: E2E Fork Gate
    runs-on: ubuntu-latest
    steps:
      - name: Verify E2E eligibility
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "::error title=Azure E2E Required::Fork PRs cannot run Azure E2E with OIDC credentials. A maintainer must review the changes and run E2E from a trusted repository branch."

            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Azure E2E validation required

          This PR originates from a fork. Azure E2E tests cannot
          run directly because they require Azure OIDC credentials.

          **Maintainer action required:**
          1. Review the proposed changes.
          2. Push the trusted commit to an Azure/AKSFlexNode branch.
          3. Run the `E2E Tests` workflow from that branch, or open a
             same-repository PR so the workflow can run automatically.

          This PR cannot merge until the required E2E validation
          policy is satisfied.
          EOF

            exit 1
          fi

          echo "PR originates from the base repository."

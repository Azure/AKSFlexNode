name: E2E Tests

# End-to-end tests for ARM Machine registration plus MSI, bootstrap-token,
# Arc, and kubeadm-style join flows.
#
# Security note: this workflow uses GitHub OIDC to obtain Azure access. Trusted
# pushes and same-repository PRs use e2e-testing. Dependabot PRs use the
# protected e2e-testing-external environment and require maintainer approval before
# any code is checked out or an OIDC token is requested.

on:
  workflow_dispatch:
    inputs:
      skip_cleanup:
        description: "Skip cleanup (keep resources for debugging)"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "hack/e2e/**"
      - "hack/controller-deployment/**"
      - "Dockerfile.aks-flex-controller"
      - "scripts/aks-flex-config"
      - "scripts/install.sh"
      - ".github/workflows/e2e-tests.yml"

  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "hack/e2e/**"
      - "hack/controller-deployment/**"
      - "Dockerfile.aks-flex-controller"
      - "scripts/aks-flex-config"
      - "scripts/install.sh"
      - ".github/workflows/e2e-tests.yml"

permissions:
  contents: read
  id-token: write

env:
  E2E_RESOURCE_GROUP: ${{ vars.E2E_RESOURCE_GROUP }}
  E2E_LOCATION: ${{ vars.E2E_LOCATION }}
  E2E_AKS_NODE_VM_SIZE: ${{ vars.E2E_AKS_NODE_VM_SIZE }}
  E2E_VM_SIZE: ${{ vars.E2E_VM_SIZE }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  GITHUB_RUN_ID: ${{ github.run_id }}
  E2E_WORK_DIR: /tmp/aks-flex-node-e2e-${{ github.run_id }}

jobs:
  e2e:
    name: E2E Tests
    # Only canonical same-repository PRs may request access to the protected E2E
    # environment. Fork PRs remain blocked.
    if: >
      github.repository == 'Azure/AKSFlexNode' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Environment approvals cannot be conditional within one environment. Route
    # only Dependabot-authored PRs through the required-reviewer environment so
    # pushes and maintainer PRs retain the existing automatic behavior.
    environment: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && 'e2e-testing-external' || 'e2e-testing' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run E2E tests, including ARM Machine registration
        env:
          E2E_SKIP_CLEANUP: "1"  # Cleanup handled in dedicated step below
        run: |
          set -euo pipefail
          ./hack/e2e/run.sh all

      - name: Collect logs
        if: always()
        run: ./hack/e2e/run.sh logs

      - name: Upload logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-logs-${{ github.run_id }}
          path: /tmp/aks-flex-node-e2e-${{ github.run_id }}/logs/
          retention-days: 7

      - name: Cleanup
        if: always()
        env:
          E2E_SKIP_CLEANUP: ${{ inputs.skip_cleanup && '1' || '0' }}
        run: ./hack/e2e/run.sh cleanup

      - name: Cleanup runner workspace
        if: always()
        run: ./hack/e2e/run.sh runner-cleanup

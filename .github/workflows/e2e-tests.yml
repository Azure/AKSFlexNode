name: E2E Tests

# End-to-end tests for MSI, bootstrap-token, and kubeadm-style join flows.
#
# Security note: this workflow uses GitHub OIDC to obtain Azure access for the
# protected e2e-testing environment. PR runs are allowed only when the PR branch
# lives in this repository; fork PRs are blocked at the job level.

on:
  workflow_dispatch:
    inputs:
      kubernetes_version:
        description: "Exact AKS/Flex Node Kubernetes patch version (for example, 1.34.9)"
        required: false
        default: "1.35.0"
        type: string
      skip_cleanup:
        description: "Skip cleanup (keep resources for debugging)"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "hack/e2e/**"
      - "hack/controller-deployment/**"
      - "Dockerfile.aks-flex-controller"
      - "scripts/aks-flex-config"
      - "scripts/install.sh"
      - ".github/workflows/e2e-tests.yml"

  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "hack/e2e/**"
      - "hack/controller-deployment/**"
      - "Dockerfile.aks-flex-controller"
      - "scripts/aks-flex-config"
      - "scripts/install.sh"
      - ".github/workflows/e2e-tests.yml"

permissions:
  contents: read
  id-token: write

env:
  E2E_RESOURCE_GROUP: ${{ secrets.E2E_RESOURCE_GROUP }}
  E2E_LOCATION: ${{ secrets.E2E_LOCATION }}
  E2E_AKS_NODE_VM_SIZE: ${{ secrets.E2E_AKS_NODE_VM_SIZE }}
  E2E_VM_SIZE: ${{ secrets.E2E_VM_SIZE }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  GITHUB_RUN_ID: ${{ github.run_id }}
  E2E_NAME_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
  E2E_WORK_DIR: /tmp/aks-flex-node-e2e-${{ github.run_id }}-${{ github.run_attempt }}
  E2E_KUBERNETES_VERSION: ${{ inputs.kubernetes_version || '1.35.0' }}

jobs:
  e2e:
    name: E2E Tests
    # Only run from the canonical repository, and never for fork PRs. Same-repo
    # PRs still require the e2e-testing environment/OIDC policy to allow access.
    if: >
      github.repository == 'Azure/AKSFlexNode' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: e2e-testing

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run E2E tests
        env:
          E2E_SKIP_CLEANUP: "1"  # Cleanup handled in dedicated step below
        run: |
          set -euo pipefail
          ./hack/e2e/run.sh all

      - name: Collect logs
        if: always()
        run: ./hack/e2e/run.sh logs

      - name: Upload logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/aks-flex-node-e2e-${{ github.run_id }}-${{ github.run_attempt }}/logs/
          retention-days: 7

      - name: Cleanup
        id: cleanup
        if: always()
        env:
          E2E_SKIP_CLEANUP: ${{ inputs.skip_cleanup && '1' || '0' }}
        run: ./hack/e2e/run.sh cleanup

      - name: Prepare cleanup diagnostics
        if: always()
        run: |
          set -euo pipefail
          umask 077
          state_file="${E2E_WORK_DIR}/state.json"
          artifact_file="${E2E_WORK_DIR}/cleanup-state.json"
          [[ -f "${state_file}" ]] || exit 0
          # Keep the resource names needed for investigation without publishing
          # secret-sourced account identifiers, addresses, or cluster access data.
          jq '{
            lifecycle,
            cleanup_complete,
            deployment_name,
            run_id,
            resource_owner,
            name_suffix,
            cluster_name,
            node_resource_group,
            msi_vm_name,
            token_vm_name,
            offline_vm_name,
            kubeadm_vm_name,
            arc_vm_name,
            arc_machine_name,
            vnet_name,
            nsg_name
          } | with_entries(select(.value != null and .value != ""))' \
            "${state_file}" > "${artifact_file}"
          chmod 0600 "${artifact_file}"

      - name: Upload cleanup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-cleanup-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/aks-flex-node-e2e-${{ github.run_id }}-${{ github.run_attempt }}/cleanup-state.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup runner workspace
        # Preserve retry metadata when Azure cleanup fails or is deliberately
        # skipped. A later successful run must not delete another attempt's state.
        if: always() && steps.cleanup.outcome == 'success' && inputs.skip_cleanup != true
        run: ./hack/e2e/run.sh runner-cleanup

name: AKS Flex Controller Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref or commit to build during a dry run"
        required: false
        type: string
      version:
        description: "Version used for image tags and build metadata"
        required: true
        type: string
      push_image:
        description: "Publish the image from the current main commit"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build controller image
    if: ${{ !inputs.push_image }}
    permissions:
      contents: read
    uses: ./.github/workflows/controller-image-build.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
      version: ${{ inputs.version }}
      push_image: false

  authorize:
    name: Approve controller image publication
    if: inputs.push_image && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Confirm approval
        run: echo "Controller image publication approved."

  publish:
    name: Publish controller image
    if: >-
      always() &&
      inputs.push_image &&
      github.ref == 'refs/heads/main' &&
      needs.authorize.result == 'success'
    needs: authorize
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/controller-image-build.yml
    with:
      source_ref: ${{ github.sha }}
      version: ${{ inputs.version }}
      push_image: true

name: AKS Flex Controller Image

on:
  push:
    tags:
      - "controller-*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref or commit to build"
        required: false
        type: string
      version:
        description: "Version used for image tags and build metadata"
        required: false
        type: string
      push_image:
        description: "Push the image to GHCR (only supported from main)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build controller image
    if: github.event_name == 'workflow_dispatch' && !inputs.push_image
    permissions:
      contents: read
    uses: ./.github/workflows/controller-image-build.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
      version: ${{ inputs.version || github.ref_name }}
      push_image: false

  publish:
    name: Publish controller image
    if: >-
      github.event_name == 'push' ||
      (inputs.push_image && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/controller-image-build.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
      version: ${{ inputs.version || github.ref_name }}
      push_image: true

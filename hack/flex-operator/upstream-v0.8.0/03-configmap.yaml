---
# unbounded-operator-config holds the environment-specific operator settings that
# used to be passed as `kubectl unbounded install` flags. It is surfaced to the
# operator Deployment via envFrom, and each operator flag defaults from the
# matching env var (an explicit flag still overrides). Edit this ConfigMap and
# then `kubectl rollout restart deployment/unbounded-operator` to apply changes:
# env is read once at pod start.
#
# The registry is configurable here. The operator always combines it with its
# own compiled version to select matching first-party component images.
apiVersion: v1
kind: ConfigMap
metadata:
  name: unbounded-operator-config
  namespace: unbounded-system
  labels:
    app.kubernetes.io/name: unbounded-operator
    app.kubernetes.io/component: controller
data:
  # Full image-repository prefix (registry host plus org/namespace) for all
  # operator-managed first-party component images. The flat component name and
  # operator version are appended, so ghcr.io/azure yields ghcr.io/azure/machina.
  UNBOUNDED_IMAGE_REGISTRY: "ghcr.io/azure"
  # External Kubernetes API endpoint advertised to provisioned machines. Remote
  # nodes dial this to join, so it must be reachable from outside the cluster.
  # Leave empty to let the operator auto-discover it: it prefers the standard
  # kube-public/cluster-info ConfigMap and, for clusters that do not publish it
  # (e.g. AKS), falls back to the KUBERNETES_SERVICE_HOST FQDN (the operator pod
  # carries kubernetes.azure.com/set-kube-service-host-fqdn so that env is the
  # public API FQDN). Set a value only to override discovery. Rendered from
  # .APIServerEndpoint so make/GitOps deploys can override via
  # --set APIServerEndpoint=; `kubectl unbounded install --api-server-endpoint`
  # overrides it in place (an empty value is preserved across reinstalls).
  UNBOUNDED_API_SERVER_ENDPOINT: ""
  # Whether the operator translates legacy net-group Sites, migrates state into
  # this namespace, and reaps the pre-consolidation namespaces.
  UNBOUNDED_REAP_LEGACY_RESOURCES: "true"

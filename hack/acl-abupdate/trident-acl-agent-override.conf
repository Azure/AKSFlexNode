# Drop-in for trident-acl-agent.service. The A/B update harness's Ignition seed
# installs it as
# /etc/systemd/system/trident-acl-agent.service.d/trident-acl-agent-override.conf
# (see README.md), and its check T1 verifies it after every boot.

[Service]
# Every setting the agent reads is pinned, including those matching its current
# defaults, so an upstream default change cannot silently alter AKS behaviour.
# Review these when the Trident version in the base image moves.

# Agent default is acl.microsoft.com; the AKS contract uses acl.azure.com. A
# mismatch is silent: the RP writes a key the agent never watches.
Environment="TRIDENT_ACL_AGENT_KUBERNETES_ANNOTATION_PREFIX=acl.azure.com"
# On a flex node, kubelet runs in an nspawn machine, so the host has no
# /var/lib/kubelet/kubeconfig, the agent's default and the AKS contract's path.
# The flex agent owns this path, and reset removes it with /etc/aks-flex-node.
# Until something writes it, the agent can't reach the API server and keeps
# restarting. The A/B harness's cluster mode writes it, with the kubelet's identity.
Environment="TRIDENT_ACL_AGENT_KUBERNETES_KUBECONFIG=/etc/aks-flex-node/trident-acl-agent.kubeconfig"

# tridentd's gRPC socket. Without it the agent falls back to the Trident CLI,
# whose finalize reboots before a terminal status can be written.
Environment="TRIDENT_ACL_AGENT_TRIDENT_SOCKET=unix:///run/trident/trident.sock"

Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_MODE=annotations"
Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_STATE_PATH=/var/lib/trident-acl-agent/state.json"
Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_STAGE_TIMEOUT=20m"
Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_FINALIZE_TIMEOUT=10m"
Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_HEARTBEAT_INTERVAL=60s"
Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_COOKIE_ENABLED=true"
Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_COOKIE_LIFETIME=per-update"
Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_COOKIE_PATH=/var/lib/trident-acl-agent/nebraska-cookie"

# The COSI's metadata SHA-384 comes from the update server's cosi.metadata.sha384
# label, not the legacy hash attribute.
Environment="TRIDENT_ACL_AGENT_COSI_SHA384_SOURCE=labels"

# A sentinel version, so the agent's version-based AlreadyAtTarget shortcut
# never decides a scenario. /etc/os-release's VERSION_ID does follow A/B
# updates, but the harness's update server offers images by their tag's
# version, such as 20261106.1.0, not by VERSION_ID, such as 3.0.20261106, and
# the installer ISO's image and its build's COSI share a VERSION_ID.
Environment="TRIDENT_ACL_AGENT_CURRENT_VERSION_PATH=/dev/null"
Environment="TRIDENT_ACL_AGENT_CURRENT_VERSION_KEY=IMAGE_VERSION"
Environment="TRIDENT_ACL_AGENT_CURRENT_VERSION_FALLBACK=0.0.0"

# Not set: NODE_NAME and API_SERVER are per-node and per-cluster and default
# correctly; NEBRASKA_* is unused in annotation mode.
#
# The node is the lowercased hostname, which the flex agent names it after too.
# kubelet-cert, the documented alternative, reads kubelet's client certificate
# from KUBELET_CERT_PATH, which on a flex node is inside the active nspawn
# machine and moves between kube1 and kube2 on a repave, so it isn't used, and
# KUBELET_CERT_PATH isn't set. If agent.nodeName names the node otherwise, set
# NODE_NAME to it.
Environment="TRIDENT_ACL_AGENT_KUBERNETES_NODE_NAME_SOURCE=hostname"
# Off, the default, until it's confirmed that kubelet's systemUUID, read inside
# the nspawn machine, is the host's product_uuid on every platform flex runs on.
# The A/B harness checks it (K1); on a KVM VM with an SMBIOS UUID it matched.
Environment="TRIDENT_ACL_AGENT_KUBERNETES_VALIDATE_NODE_UUID=false"
# Not set: NODE_GONE_MAX_WAIT, so the agent waits for a deleted Node to come
# back however long that takes, as reimaging and rejoining need.

StateDirectory=trident-acl-agent

# Trident before 0.29 exits cleanly until kubelet registers the Node. Restart it
# after a pause so path unit re-triggers can't hit systemd's start limit.
Restart=always
RestartSec=5

# Diagnostics only. Each of these absences makes the agent behave differently,
# and this records which one in the journal that is collected on failure.
ExecStartPre=-/usr/bin/sh -c '\
for p in /etc/aks-flex-node/trident-acl-agent.kubeconfig /run/trident/trident.sock; do \
  [ -e "$p" ] && echo "trident-acl-agent preflight: present $p" || echo "trident-acl-agent preflight: MISSING $p"; \
done'
